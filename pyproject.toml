[project]
name = "py-project-template"
version = "1.8.0"
description = "Starter template for a Python app - including CI and docs"
authors = [
  { name = "Michael Currin", email = "18750745+MichaelCurrin@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
pylint = "^3.3.2"
pylint-exit = "^1.2.0"
mypy = "^1.14.0"
pytest = "^8.3.4"
ruff = "^0.8.4"

[tool.poetry]
# Remove this line if you want to distribute your project as an installable package.
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
